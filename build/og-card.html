<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  AQcredix — source artwork for the Open Graph share image.

  WHY THIS IS AN HTML FILE. The share image is 1200x630 PNG because WhatsApp and LinkedIn
  will not render an SVG card, and WhatsApp is where a hospital link actually gets
  forwarded. Rather than hand-encode a PNG or add a design dependency, the card is laid
  out here and rasterised by headless Chrome — see build/make-og.js. Editing the wording
  is therefore a text edit, not a redraw.

  Georgia is deliberate, not a fallback. The ring mark's serif A was positioned by
  Georgia's baseline metrics (see build/serif-mark.js), so the wordmark and the mark share
  a skeleton. Chrome on Windows has Georgia, and this file is only ever rendered here.

  Direction B palette — deep forest teal on warm paper, brass as the single accent.
-->
<style>
  @page { size: 1200px 630px; margin: 0; }
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#0B2F2A;
    font-family:Georgia,"Times New Roman",serif;
    color:#F4F2EC;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;
  }
  /* A single hairline arc echoing the mark, held well back so it reads as paper texture
     rather than decoration. */
  .ghost{position:absolute;right:-170px;top:-150px;width:720px;height:720px;
    border:1.5px solid rgba(140,106,63,.20);border-radius:50%}
  .ghost2{position:absolute;right:-95px;top:-75px;width:570px;height:570px;
    border:1.5px solid rgba(76,111,255,.10);border-radius:50%}

  .top{display:flex;align-items:center;gap:26px;padding:64px 72px 0;position:relative;z-index:2}
  .mark{width:82px;height:82px;flex:none}
  .wordmark{font-size:50px;letter-spacing:-.012em;line-height:1}
  .wordmark b{font-weight:400}
  .rule{height:1px;background:linear-gradient(90deg,rgba(244,242,236,.34),rgba(244,242,236,0));
    margin:0 72px;position:relative;z-index:2}

  .mid{padding:0 72px;position:relative;z-index:2}
  h1{font-size:74px;line-height:1.06;letter-spacing:-.022em;font-weight:400;margin:0;
    max-width:19ch}
  h1 i{font-style:italic;color:#4C6FFF}

  .foot{padding:0 72px 62px;display:flex;justify-content:space-between;
    align-items:flex-end;gap:40px;position:relative;z-index:2}
  .desc{font-family:system-ui,"Segoe UI",sans-serif;font-size:20px;line-height:1.5;
    color:rgba(244,242,236,.74);max-width:44ch}
  .domain{font-family:system-ui,"Segoe UI",sans-serif;font-size:17px;letter-spacing:.14em;
    text-transform:uppercase;color:#B08D57;white-space:nowrap;font-weight:600}
</style>
</head>
<body>
  <div class="ghost"></div>
  <div class="ghost2"></div>

  <div class="top">
    <!-- The site's own mark, paths lifted verbatim from the favicon in index.html so the
         card cannot drift from the brand. The grey full ring is the gap not yet closed;
         the teal arc is the part that is. That is the whole idea of the product, which is
         why it is not redrawn here as a plain circle. The A is an outlined path with
         fill-rule evenodd — as a <text> glyph it drifted off-centre wherever Georgia was
         absent, and the counter fills solid without the rule. -->
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(244,242,236,.26)" stroke-width="3.4"/>
      <path d="M20 4a16 16 0 1 1-11.31 4.69" fill="none" stroke="#4C6FFF"
            stroke-width="3.4" stroke-linecap="round"/>
      <path d="M19.15 14.05H20.85L25.61 25.015H26.97V25.95H22.21V25.015H23.315L22 22H18L16.685 25.015H17.79V25.95H13.03V25.015H14.39ZM20 16.26L22.027 20.935H17.973Z"
            fill="#F4F2EC" fill-rule="evenodd"/>
    </svg>
    <div class="wordmark"><b>AQcredix</b></div>
  </div>

  <div class="rule"></div>

  <div class="mid">
    <h1>Know it before the <i>assessor</i> does.</h1>
  </div>

  <div class="foot">
    <div class="desc">Every NABH standard explained the way an assessor reads it — then the
      system that runs it: committee calendars, recurring obligations, and evidence filed
      against the element it proves.</div>
    <div class="domain">aqcredix.com</div>
  </div>
</body>
</html>
