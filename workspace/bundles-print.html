<meta name="robots" content="noindex">

<style>
  /* The bundle form reuses the blank-checklist print contract wholesale and
     adds only what a bundle needs that a NABH element list does not: a
     yes/no/NA column trio, a row per patient, and the all-or-none verdict
     box that makes the scoring rule impossible to miss on paper. */
  .bnp-grid { width:100%; border-collapse:collapse; margin-top:8px; }
  .bnp-grid th, .bnp-grid td { border:1px solid #C7D5DD; padding:5px 6px;
    font-size:10.5px; vertical-align:middle; }
  .bnp-grid th { background:#0B4F6C; color:#fff; font-size:9.5px;
    text-transform:uppercase; letter-spacing:.05em; }
  .bnp-grid th.pt { width:34px; }
  .bnp-el { text-align:left; }
  .bnp-tick { width:26px; text-align:center; color:#7A8A95; font-size:9px; }
  .bnp-rowhead { background:#EEF7F5; font-weight:700; }
  .bnp-rule { margin-top:10px; padding:8px 10px; border-left:3px solid #B02A2A;
    background:#FDF2F2; font-size:10.5px; line-height:1.45; }
  .bnp-rule b { color:#B02A2A; }
  .bnp-meta { display:grid; grid-template-columns:repeat(4,1fr); gap:0;
    border:1px solid #20A39E; border-radius:4px; overflow:hidden; margin-bottom:12px; }
  .bnp-meta div { padding:8px 10px; border-right:1px solid #E1E7EE; min-height:40px; }
  .bnp-meta div:last-child { border-right:none; }
  .bnp-meta label { display:block; font-size:9px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; color:#0B4F6C; }
  .bnp-shift { display:flex; gap:6px; margin-top:3px; }
  .bnp-shift span { border:1px solid #C7D5DD; border-radius:3px; padding:1px 6px; font-size:9.5px; }
  .bnp-verdict { width:74px; text-align:center; font-size:9px; color:#7A8A95; }
</style>
<!-- aq:meta — generated by build/set-meta.js, do not edit by hand -->
<script defer src="/_vercel/insights/script.js"></script>
<!-- /aq:meta -->
<!-- aq:glass — generated by build/add-glass.js, do not edit by hand -->
<link rel="stylesheet" href="../aq-glass.css?v=20260926n">

<script>(function(){try{var p=new URLSearchParams(location.search);if(p.get("glass")==="0"){localStorage.setItem("aq-glass","off");}else if(p.get("glass")==="1"){localStorage.removeItem("aq-glass");}if(localStorage.getItem("aq-glass")!=="off"){document.documentElement.setAttribute("data-glass","");}}catch(e){document.documentElement.setAttribute("data-glass","");}})();</script>
<!-- /aq:glass -->
