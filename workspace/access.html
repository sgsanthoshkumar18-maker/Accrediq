<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{if(localStorage.getItem("aq-theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}if(localStorage.getItem("aq-palette")==="neon"){document.documentElement.setAttribute("data-palette","neon");}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access &amp; Subscriptions — AQcredix Workspace</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='16' fill='none' stroke='%23D8E0E6' stroke-width='3.4'/><path d='M20 4a16 16 0 1 1-11.31 4.69' fill='none' stroke='%2317A2B8' stroke-width='3.4' stroke-linecap='round'/><text x='20' y='27' text-anchor='middle' font-family='Georgia,serif' font-size='17' fill='%2317A2B8'>A</text></svg>">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="workspace.css">
<link rel="stylesheet" href="auth-gate.css">
<link rel="stylesheet" href="../billing/billing.css">
</head>
<body data-page="workspace" data-base="../">
<div id="site-header"></div>
<div class="ws-nav" id="wsNav"></div>
<main id="aq-main">
  <div id="wsGate"></div>
  <div id="wsBody" style="display:none">
    <section class="section wrap"><div id="accBody"></div></section>
  </div>
</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="../app.js"></script>
<script src="../billing/billing-config.js"></script>
<script src="auth-gate.js"></script>
<script src="store.js"></script>
<script src="../billing/billing.js"></script>
<script src="../billing/paywall.js"></script>
<script src="shell.js"></script>
<script>
(async function () {
  var W = window.AQWorkspace, B = window.AQBilling;
  if (!(await W.gate())) return;
  // The nav hides this tab from non-owners, but a hidden link is not a locked door —
  // someone can still type the URL. Check again here.
  if (!B.isOwner(W.user)) {
    document.getElementById("wsBody").style.display = "";
    document.getElementById("accBody").innerHTML =
      '<div class="pw-note bad"><b>Owner access only.</b><p>This page manages ' +
      'subscriptions and payment approvals.</p></div>';
    W.renderNav("access");
    return;
  }
  W.renderNav("access");
  document.getElementById("wsBody").style.display = "";
  try {
    await window.AQPaywall.renderAdmin(document.getElementById("accBody"), W.user);
  } catch (e) {
    document.getElementById("accBody").innerHTML =
      '<div class="pw-note bad"><b>Could not load subscriptions.</b>' +
      '<p>If the <code>subscriptions</code> table does not exist yet, run ' +
      '<code>workspace/schema.sql</code> in Supabase and reload.</p>' +
      '<p class="pw-tech">' + String(e && e.message || e) + '</p></div>';
  }
})();
</script>
</body>
</html>
