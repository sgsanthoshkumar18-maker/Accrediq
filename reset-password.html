  /* A single-purpose page: someone locked out of their account, arriving from
     an email link, on a phone as often as not. No nav, no marketing, nothing
     to click but the one thing they came to do. */
  .rp-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg); }
  .rp-card { width:100%; max-width:430px; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:16px; padding:32px;
    box-shadow:var(--shadow-2); }
  .rp-brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .rp-brand svg { width:34px; height:34px; }
  .rp-brand b { font-size:17px; color:var(--fg); }
  .rp-card h1 { margin:0 0 6px; font-size:22px; letter-spacing:-.02em; }
  .rp-card .rp-sub { margin:0 0 22px; font-size:14px; color:var(--fg-muted); line-height:1.5; }
  .rp-f { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .rp-f label { font:700 11.5px/1 var(--font-body); text-transform:uppercase;
    letter-spacing:.06em; color:var(--fg-muted); }
  .rp-in { position:relative; display:flex; }
  .rp-in input { flex:1; padding:11px 44px 11px 13px; font:15px/1.3 var(--font-body);
    color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:9px; }
  .rp-in input:focus { outline:none; border-color:var(--brand-2);
    box-shadow:0 0 0 3px var(--border-soft); }
  .rp-eye { position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; cursor:pointer; color:var(--fg-faint);
    border-radius:7px; }
  .rp-eye:hover { color:var(--fg); background:var(--border-soft); }
  .rp-eye:focus-visible { outline:2px solid var(--brand-2); outline-offset:-2px; }
  .rp-meter { height:4px; border-radius:3px; background:var(--border-soft); overflow:hidden; margin-top:2px; }
  .rp-meter i { display:block; height:100%; width:0; border-radius:3px; transition:width .2s, background .2s; }
  .rp-hint { font-size:11.5px; color:var(--fg-faint); }
  .rp-btn { width:100%; padding:12px; font:700 15px/1 var(--font-body); cursor:pointer;
    border:none; border-radius:9px; background:var(--accent-solid); color:var(--on-accent);
    margin-top:6px; }
  .rp-btn:disabled { opacity:.55; cursor:not-allowed; }
  .rp-msg { margin-top:16px; padding:12px 14px; border-radius:9px; font-size:13.5px;
    line-height:1.5; display:none; }
  .rp-msg.on { display:block; }
  .rp-msg.bad { background:var(--nc-tint); color:var(--nc); border-left:3px solid var(--nc); }
  .rp-msg.good { background:var(--ok-tint); color:var(--ok); border-left:3px solid var(--ok); }
  .rp-back { display:block; margin-top:20px; text-align:center; font-size:13px;
